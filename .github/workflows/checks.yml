name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
        working-directory: backend
      - run: uv run ruff check circuit_lantern tests
        working-directory: backend
      - run: uv run ruff format --check circuit_lantern tests
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: bash scripts/test-ui.sh --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification-${{ matrix.shard }}
          path: |
            artifacts/screenshots
            web/test-results
          if-no-files-found: ignore

  web:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser shard
        run: test "${{ needs.browser.result }}" = success
